name: Enterprise 1200 E2E Test Automation CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-automation:
    name: Execute 1200 E2E Automation Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Install Dependencies
        run: npm ci || npm install

      - name: 4. Execute 1200 E2E Test Suite (Selenium, Appium, Security & Load)
        run: npm run test:all

      - name: 5. Upload Excel Automation Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: excel-reports
          path: |
            reports/excel/E2E_Comprehensive_Report.xlsx
            reports/excel/E2E_Report.xlsx
            reports/excel/Mobile_E2E_Report.xlsx
            reports/excel/Vulnerability_Report.xlsx
            reports/excel/Load_Report.xlsx

      - name: 6. Upload HTML Test Dashboard & Logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: html-reports-and-logs
          path: |
            reports/index.html
            logs/
            reports/failures/
